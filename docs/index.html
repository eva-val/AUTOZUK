<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTOZUK — Inferno Wave Solver</title>
  <script type="module" crossorigin src="./assets/index-CW1OmG98.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BNXHb2dN.css">
</head>
<body>
<div id="appRoot">
  <div class="app-header">
    <h1>AUTOZUK</h1>
  </div>
  <div class="main-layout">
    <div class="controls-panel">
      <div class="autozuk-section" style="margin-top:0;padding-top:6px">
        <h3>WAVE INFO</h3>
      </div>
      <div class="control-group">
        <label>Spawn Code</label>
        <div style="display:flex;gap:4px">
          <input type="text" id="spawnCode" placeholder="e.g. YooMXoRoB" maxlength="18" value="" style="flex:1">
          <button type="button" class="btn btn-secondary" id="btnPaste" style="padding:6px 8px;font-size:9px;letter-spacing:0;flex-shrink:0" title="Paste from clipboard">PASTE</button>
        </div>
      </div>
      <div class="control-group">
        <label>Pillars</label>
        <div class="pillar-toggles">
          <button type="button" class="pillar-btn active" id="pillarS">South</button>
          <button type="button" class="pillar-btn active" id="pillarW">West</button>
          <button type="button" class="pillar-btn active" id="pillarN">North</button>
        </div>
      </div>
      <div class="status-msg" id="statusMsg">Enter spawn code and click a tile to place the player</div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="btnReset">RESET</button>
      </div>
      <!-- MANUAL SIMULATION -->
      <div class="autozuk-section">
        <h3>MANUAL SIMULATION</h3>
        <div class="tick-display" id="tickDisplay"><span>TICK</span><br>—</div>
        <div class="sim-controls">
          <button type="button" class="btn btn-secondary" id="btnStep">STEP</button>
          <button type="button" class="btn btn-primary" id="btnPlay">▶ PLAY</button>
        </div>
        <div class="speed-control">
          <label style="font-size:9px;min-width:32px">Speed</label>
          <input type="range" id="speedSlider" min="1" max="60" value="10">
          <span class="speed-label" id="speedLabel">10 t/s</span>
        </div>
      </div>
      <!-- PHASE 2: AUTOZUK SOLVER -->
      <div class="autozuk-section">
        <h3>AUTOZUK SOLVER</h3>
        <div class="control-group">
          <label>Loadout</label>
          <select id="loadoutSelect" style="background:var(--bg);border:1px solid var(--panel-border);color:var(--text);padding:6px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;width:100%;cursor:pointer">
            <option value="blowpipe">Max Blowpipe</option>
            <option value="magetank">Mage Tank</option>
            <option value="bloodBarrage">Blood Barrage</option>
          </select>
        </div>
        <div class="control-group" style="margin-top:6px">
          <label>Max Simulations / Tile</label>
          <input type="number" id="maxSims" value="100" min="10" max="10000" style="font-size:12px;letter-spacing:0">
        </div>
        <div class="control-group" style="margin-top:6px">
          <label>Max Ticks / Sim</label>
          <input type="number" id="maxTicks" value="400" min="50" max="1000" style="font-size:12px;letter-spacing:0">
        </div>
        <button type="button" class="btn btn-primary" style="width:100%;margin-top:6px;padding:12px;font-size:13px;letter-spacing:2px" id="btnAutozuk">START AUTOZUK</button>
        <div style="display:flex;gap:4px;margin-top:4px">
          <button type="button" class="btn btn-secondary" id="btnResetAutozuk" style="flex:1;padding:8px;font-size:10px;letter-spacing:1px">RESET</button>
          <button type="button" class="btn btn-secondary" id="btnHideAZ" style="flex:1;padding:8px;font-size:10px;letter-spacing:1px">HIDE</button>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="autozuk-status" id="autozukStatus"></div>
      </div>
    </div>
    <div class="grid-area">
      <div style="display:flex;justify-content:flex-end;padding:0 2px 4px 0">
        <button type="button" class="btn btn-secondary" id="compassBtn" style="padding:4px 8px;font-size:11px;font-weight:800;letter-spacing:1px;min-width:28px" title="Camera facing direction">S</button>
      </div>
      <canvas id="grid" width="580" height="600"></canvas>
      <!-- Prayer sequence icons below grid -->
      <div id="prayerStrip" style="display:none;margin-top:4px;justify-content:center;align-items:center;gap:6px;padding:4px 0;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim)"></div>
      <!-- Scrolling feed under canvas (shown during AUTOZUK) -->
      <div id="liveFeedPanel" style="display:none;width:100%;max-height:120px;overflow-y:auto;padding:4px 8px;background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10px">
      </div>
    </div>
    <div class="right-panel">
      <!-- Phase 1 tick grid -->
      <div id="phase1Panel" class="tickgrid-section" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div class="section-header">Tick Grid<span class="count" id="tickGridCount">0 hits</span></div>
        <div class="tickgrid-wrapper" id="tickGridWrapper">
          <table class="tickgrid-table" id="tickGridTable">
            <thead id="tickGridHead"><tr><th class="tick-col">T</th></tr></thead>
            <tbody id="tickGridBody"></tbody>
          </table>
        </div>
      </div>
      <!-- Live tile detail (replaces tick grid during AUTOZUK) -->
      <div id="liveDetailPanel" style="flex:1;display:none;flex-direction:column;min-height:0;overflow-y:auto;padding:10px">
      </div>
      <!-- Phase 2 detail panel (hidden by default) -->
      <div id="detailPanel" class="detail-panel detail-hidden"></div>
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="eventlist-section" id="eventlistSection">
        <div class="section-header">Event List<span class="count" id="eventCount">0 events</span></div>
        <div class="eventlist-wrapper" id="eventListBody">
          <div style="padding:8px;text-align:center;color:var(--text-dim);font-size:10px">Load a wave to see events</div>
        </div>
      </div>
      <div style="padding:8px 12px;border-top:1px solid var(--panel-border);flex-shrink:0" id="exportSection">
        <button type="button" class="btn btn-secondary" id="btnExportTilemarker" style="width:100%;font-size:10px;padding:7px">EXPORT TILEMARKER</button>
        <div id="exportStatus" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);text-align:center;margin-top:4px;min-height:14px"></div>
      </div>
    </div>
  </div>
  <div class="legend-popup" id="legendPopup">
    <button type="button" class="legend-btn" id="legendBtn">Legend</button>
  </div>
  <div id="statusBox" style="position:fixed;bottom:8px;left:8px;width:284px;background:var(--panel);border:1px solid var(--panel-border);border-radius:8px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;z-index:90">
    <label style="font-size:9px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px">Player Status</label>
    <div class="mob-info" id="playerStatus" style="margin:3px 0 6px 0;min-height:16px">No simulation loaded</div>
    <label style="font-size:9px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px">Mobs Status</label>
    <div class="mob-info" id="mobInfo" style="margin:3px 0 0 0;max-height:148px;overflow-y:auto">No mobs alive</div>
  </div>
</div>
</body>
</html>
